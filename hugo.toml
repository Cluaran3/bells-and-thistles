baseURL = "https://bellsandthistl.es/"
locale = "en-us"
title = "Bells and Thistles"
theme = "cactus"
copyright = "Bells and Thistles"

# Main menu. Cactus sorts items by weight.
[[menu.main]]
name = "Home"
url = "/"
weight = 1

[[menu.main]]
name = "Blog"
url = "/blog"
weight = 3

[[menu.main]]
name = "Projects"
url = "/projects"
weight = 4

[[menu.main]]
name = "Resume"
url = "/resume"
weight = 5

[params]
  colortheme = "white"           # dark, light, white, or classic
  rss = true
  mainSection = "blog"           # target of the "Blog" heading link on the home page
  showAllPostsOnHomePage = false
  postsOnHomePage = 5
  tagsOverview = true
  showProjectsList = false       # Projects is a standalone page, not the theme's data-driven widget
  dateFormat = "January 02, 2006"
  mainSections = ["blog"]        # sections listed in the home page feed
  mainSectionTitle = "Blog"
  css = ["css/custom.css"]

  [params.comments]
    enabled = false

  # Social links. `name` must match a Font Awesome brand icon; "email" is handled separately.
  [[params.social]]
  name = "github"
  link = "https://github.com/Cluaran3"
  [[params.social]]
  name = "linkedin"
  link = "https://www.linkedin.com/in/nadya-krasnushkina-353248134/"
  [[params.social]]
  name = "email"
  link = "krasnushkina@gmail.com"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
